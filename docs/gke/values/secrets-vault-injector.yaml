# HCP Vault Agent Injector hybrid.
#
# Application and S3 credentials are rendered to /vault/secrets/env for backend
# and workers. Current chart constraints still require Kubernetes Secrets for
# PGPASSWORD and the migration Job's LIGHTDASH_SECRET.

secrets: null
existingSecret: ""

secretRefs:
  enabled: false

externalDatabase:
  password: ""
  existingSecret: lightdash-database
  secretKeys:
    passwordKey: PGPASSWORD

s3:
  accessKey: ""
  secretKey: ""
  existingSecret: ""

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-pre-populate-only: "true"
  vault.hashicorp.com/agent-init-first: "true"
  vault.hashicorp.com/agent-inject-containers: "lightdash"
  vault.hashicorp.com/service: "REPLACE_HCP_VAULT_PUBLIC_URL"
  vault.hashicorp.com/namespace: "admin"
  vault.hashicorp.com/auth-type: "gcp"
  vault.hashicorp.com/auth-path: "auth/gcp"
  vault.hashicorp.com/auth-config-type: "iam"
  vault.hashicorp.com/auth-config-service-account: "lightdash-cloud-sql@REPLACE_PROJECT_ID.iam.gserviceaccount.com"
  vault.hashicorp.com/role: "lightdash-gke-injector"
  vault.hashicorp.com/agent-inject-secret-env: "kv/data/apps/lightdash/application"
  vault.hashicorp.com/agent-inject-perms-env: "0400"
  vault.hashicorp.com/error-on-missing-key-env: "true"
  vault.hashicorp.com/agent-inject-template-env: |
    {{- with secret "kv/data/apps/lightdash/application" -}}
    export LIGHTDASH_SECRET='{{ .Data.data.LIGHTDASH_SECRET | replaceAll "'" "'\\''" }}'
    {{- end }}
    {{- with secret "kv/data/apps/lightdash/s3" -}}
    export S3_ACCESS_KEY='{{ .Data.data.S3_ACCESS_KEY | replaceAll "'" "'\\''" }}'
    export S3_SECRET_KEY='{{ .Data.data.S3_SECRET_KEY | replaceAll "'" "'\\''" }}'
    {{- end }}

image:
  command:
    - /bin/sh
    - -c
    - ". /vault/secrets/env && exec dumb-init -- node dist/index.js"

scheduler:
  command:
    - /bin/sh
    - -c
    - ". /vault/secrets/env && exec node dist/scheduler.js"

appBuildWorker:
  command:
    - /bin/sh
    - -c
    - ". /vault/secrets/env && exec node dist/scheduler.js"

warehouseNatsWorker:
  command:
    - /bin/sh
    - -c
    - ". /vault/secrets/env && exec node dist/natsWorker.js --stream warehouse"

preAggregateNatsWorker:
  command:
    - /bin/sh
    - -c
    - ". /vault/secrets/env && exec node dist/natsWorker.js --stream pre-aggregate"

migrationJob:
  extraEnv:
    - name: LIGHTDASH_SECRET
      valueFrom:
        secretKeyRef:
          name: lightdash-application
          key: LIGHTDASH_SECRET
  podAnnotations: {}
