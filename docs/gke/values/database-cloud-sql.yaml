# Cloud SQL private-IP connection through restartable Auth Proxy init-sidecars.
postgresql:
  enabled: false

externalDatabase:
  host: "127.0.0.1"
  port: 5432
  user: lightdash
  database: lightdash
  password: ""
  existingSecret: ""

initContainers:
  - name: cloud-sql-proxy
    restartPolicy: Always
    image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.0"
    args:
      - "--structured-logs"
      - "--private-ip"
      - "--address=127.0.0.1"
      - "--port=5432"
      - "REPLACE_PROJECT_ID:europe-west1:REPLACE_CLOUD_SQL_INSTANCE"
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

serviceAccount:
  create: true
  name: lightdash
  annotations:
    iam.gke.io/gcp-service-account: "lightdash-cloud-sql@REPLACE_PROJECT_ID.iam.gserviceaccount.com"

migrationJob:
  serviceAccount:
    create: true
    name: lightdash-migration
    annotations:
      iam.gke.io/gcp-service-account: "lightdash-cloud-sql@REPLACE_PROJECT_ID.iam.gserviceaccount.com"
