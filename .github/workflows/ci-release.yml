name: CI Release Charts

on:
  push:
    branches:
      - main

concurrency:
  group: chart-release
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: kindest/node:v1.35.0

      - name: Run fresh install rehearsal
        run: scripts/rehearsal/rehearse.sh --install-only --to local --skip-cluster

      - name: Clean up fresh install
        run: |
          helm uninstall lightdash --wait || true
          kubectl delete pvc --all --wait=false --request-timeout=10s
          deadline=$((SECONDS + 120))
          while true; do
            pvc_names="$(kubectl get pvc -o name --request-timeout=10s)"
            [[ -z "$pvc_names" ]] && break
            ((SECONDS < deadline)) || exit 1
            sleep 2
          done

      - name: Run upgrade rehearsal
        run: scripts/rehearsal/rehearse.sh --to local --skip-cluster

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      - name: Add Helm dependency repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add sagikazarmark https://charts.sagikazarmark.dev
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo update

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true
