name: GitOps Migration Scale-down

on:
  pull_request:
  workflow_dispatch:

jobs:
  argocd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install fixture dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Create disposable kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: kindest/node:v1.33.7

      - name: Check real Argo CD syncs
        run: scripts/test-gitops-migration-scale-down.sh
