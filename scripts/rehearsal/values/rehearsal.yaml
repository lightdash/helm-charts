configMap:
  SITE_URL: http://lightdash:8080
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: lightdash
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY: rehearsal-minio
  S3_SECRET_KEY: rehearsal-minio-password

secrets:
  LIGHTDASH_SECRET: rehearsal-lightdash-secret

browserless-chrome:
  enabled: false

postgresql:
  enabled: true
  auth:
    username: lightdash
    password: rehearsal-postgres-password
    postgresPassword: rehearsal-postgres-superuser-password
    database: lightdash
