# Strict externally managed Secrets, as an operator (Vault Secrets Operator, External Secrets
# Operator) would supply them. Exercises every secretRefs branch: the strict envFrom on the backend
# and workers, the per-key S3 secretKeyRef, both `required` guards, the migration Job's own Secret,
# and the three template guards that stop the chart creating Secrets of its own.
secretRefs:
  enabled: true
  application:
    name: lightdash-application
  database:
    name: lightdash-database
    passwordKey: PGPASSWORD
  s3:
    name: lightdash-s3
    accessKey: S3_ACCESS_KEY
    secretKey: S3_SECRET_KEY
  # Required with migrationJob.enabled: the Job gets neither the application nor the S3 Secret, but
  # Lightdash reads LIGHTDASH_SECRET while loading its config.
  migration:
    name: lightdash-migration

postgresql:
  enabled: false

externalDatabase:
  host: postgres.invalid
  user: lightdash
  database: lightdash
  port: 5432

# S3 endpoint/bucket/region are not secrets. Setting them here puts them in BOTH the application
# ConfigMap and the migration ConfigMap, which is what the migration Job needs -- it never receives
# the S3 Secret, and Lightdash requires all three at startup even though the migrator never uses S3.
s3:
  endpoint: http://s3.invalid
  bucket: lightdash-ci
  region: us-east-1

migrationJob:
  enabled: true

scheduler:
  enabled: true

browserless-chrome:
  enabled: false
