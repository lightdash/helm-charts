{{- if and .Values.configMap .Values.migrationJob.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "lightdash.fullname" . }}-migration-configmap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
data:
  PGUSER: {{ include "lightdash.database.user" . }}
  PGHOST: {{ include "lightdash.database.host" . }}
  PGPORT: {{ include "lightdash.database.port" . | quote }}
  PGDATABASE: {{ include "lightdash.database.name" . }}
  {{- if .Values.nats.enabled }}
  NATS_URL: {{ include "lightdash.nats.url" . }}
  {{- end }}
  {{- if not .Values.configMap.LIGHTDASH_INSTALL_TYPE }}
  LIGHTDASH_INSTALL_TYPE: "helm"
  {{- end }}
  {{- if not .Values.configMap.LIGHTDASH_HELM_CHART_VERSION }}
  LIGHTDASH_HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  {{- end }}
  {{- if not .Values.configMap.LIGHTDASH_MIGRATION_EXECUTION_MODE }}
  LIGHTDASH_MIGRATION_EXECUTION_MODE: "helm-job"
  {{- end }}
  {{- toYaml .Values.configMap | nindent 2 }}
{{- end }}
