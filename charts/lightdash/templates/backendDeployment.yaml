{{- $volumes := .Values.lightdashBackend.extraVolumes }}
{{- $volumeMounts := .Values.lightdashBackend.extraVolumeMounts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lightdash.fullname" . }}-backend
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if and .Values.autoscaling.enabled .Release.IsUpgrade .Values.migrationJob.enabled .Values.migrationJob.scaleDownWorkloads.enabled }}
  replicas: {{ .Values.autoscaling.minReplicas }}
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.lightdashBackend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lightdash.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "lightdash.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "lightdash.serviceAccountName" . }}
      containers:
        {{- if .Values.extraContainers }}
          {{- toYaml .Values.extraContainers | nindent 8 }}
        {{- end }}
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.image.command }}
          command: {{ .Values.image.command }}
          {{- else if .Values.migrationJob.enabled }}
          # Migration Job is the sole migrator; start the server without migrating to avoid racing it for the knex lock.
          command: ["dumb-init", "--", "node", "dist/index.js"]
          {{- end }}
          args: {{ .Values.image.args }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ (include "lightdash.database.secretName" .) }}
                  key: {{ (include "lightdash.database.secret.passwordKey" .) }}
              {{- include "lightdash.sslEnvs" . | nindent 12 -}}
              {{- if .Values.extraEnv }}
              {{- toYaml .Values.extraEnv | nindent 12 }}
              {{- end }}
          envFrom:
            - configMapRef:
                name: {{ template "lightdash.fullname" $ }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- else if .Values.secrets }}
            - secretRef:
                name: {{ template "lightdash.fullname" $ }}
            {{- end }}
            {{- if .Values.s3.existingSecret }}
            - secretRef:
                name: {{ .Values.s3.existingSecret }}
            {{- else if or .Values.s3.accessKey .Values.s3.secretKey }}
            - secretRef:
                name: {{ template "lightdash.fullname" $ }}-s3
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.lightdashBackend.startupProbe }}
          startupProbe:
            {{- if .Values.lightdashBackend.startupProbe.initialDelaySeconds }}
            initialDelaySeconds: {{ .Values.lightdashBackend.startupProbe.initialDelaySeconds }}
            {{- end }}
            {{- if .Values.lightdashBackend.startupProbe.timeoutSeconds }}
            timeoutSeconds: {{ .Values.lightdashBackend.startupProbe.timeoutSeconds }}
            {{- end }}
            {{- if .Values.lightdashBackend.startupProbe.periodSeconds }}
            periodSeconds: {{ .Values.lightdashBackend.startupProbe.periodSeconds }}
            {{- end }}
            {{- if .Values.lightdashBackend.startupProbe.failureThreshold }}
            failureThreshold: {{ .Values.lightdashBackend.startupProbe.failureThreshold }}
            {{- end }}
            {{- if .Values.lightdashBackend.startupProbe.successThreshold }}
            successThreshold: {{ .Values.lightdashBackend.startupProbe.successThreshold }}
            {{- end }}
            httpGet:
              path: {{ .Values.lightdashBackend.startupProbe.path | default "/api/v1/livez" }}
              port: {{ .Values.service.port }}
          {{- end }}
          livenessProbe:
            initialDelaySeconds: {{ .Values.lightdashBackend.livenessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.lightdashBackend.livenessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.lightdashBackend.livenessProbe.periodSeconds }}
            {{- if .Values.lightdashBackend.livenessProbe.failureThreshold }}
            failureThreshold: {{ .Values.lightdashBackend.livenessProbe.failureThreshold }}
            {{- end }}
            {{- if .Values.lightdashBackend.livenessProbe.successThreshold }}
            successThreshold: {{ .Values.lightdashBackend.livenessProbe.successThreshold }}
            {{- end }}
            httpGet:
              path: /api/v1/livez
              port: {{ .Values.service.port }}
          readinessProbe:
            initialDelaySeconds: {{ .Values.lightdashBackend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.lightdashBackend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.lightdashBackend.readinessProbe.timeoutSeconds }}
            {{- if .Values.lightdashBackend.readinessProbe.failureThreshold }}
            failureThreshold: {{ .Values.lightdashBackend.readinessProbe.failureThreshold }}
            {{- end }}
            {{- if .Values.lightdashBackend.readinessProbe.successThreshold }}
            successThreshold: {{ .Values.lightdashBackend.readinessProbe.successThreshold }}
            {{- end }}
            httpGet:
              path: {{ include "lightdash.backendReadinessProbePath" . }}
              port: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.lightdashBackend.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $volumeMounts .Values.ssl.enabled }}
          volumeMounts:
            {{- if $volumeMounts }}
            {{- toYaml $volumeMounts | nindent 12 }}
            {{- end }}
            {{- include "lightdash.sslConfigMapVolumeMount" . | nindent 12 }}
          {{- end }}
     {{- if or $volumes .Values.ssl.enabled }}
      volumes:
        {{- if $volumes }}
        {{- toYaml $volumes | nindent 8 }}
        {{- end }}
        {{- include "lightdash.sslConfigMapVolume" . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      {{- end }} 
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.podAntiAffinity.enabled .Values.affinity }}
      affinity:
        {{- include "lightdash.podAntiAffinity" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.lightdashBackend.terminationGracePeriodSeconds | default 90 }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
