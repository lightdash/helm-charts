{{- if .Values.configMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "lightdash.fullname" . }}
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
data:
  PGUSER: {{ include "lightdash.database.user" . }}
  PGHOST: {{ include "lightdash.database.host" . }}
  PGPORT: {{ include "lightdash.database.port" . | quote }}
  PGDATABASE: {{ include "lightdash.database.name" . }}
  HEADLESS_BROWSER_HOST: {{ include "lightdash.headlessBrowser.host" . | quote }}
  HEADLESS_BROWSER_PORT: {{ include "lightdash.headlessBrowser.port" .  | quote }}
  {{- if .Values.scheduler.enabled }}
  SCHEDULER_ENABLED: "false"
  {{- else }}
  SCHEDULER_ENABLED: "true"
  {{- end }}
  {{- if .Values.nats.enabled }}
  NATS_ENABLED: "true"
  {{- else }}
  NATS_ENABLED: "false"
  {{- end }}
  {{- if .Values.preAggregateNatsWorker.enabled }}
  PRE_AGGREGATES_ENABLED: "true"
  PRE_AGGREGATES_PARQUET_ENABLED: "true"
  {{- else }}
  PRE_AGGREGATES_ENABLED: "false"
  PRE_AGGREGATES_PARQUET_ENABLED: "false"
  {{- end }}
  {{- if .Values.nats.enabled }}
  NATS_URL: {{ include "lightdash.nats.url" . }}
  {{- end }}
  {{- if not .Values.configMap.LIGHTDASH_INSTALL_TYPE }}
  LIGHTDASH_INSTALL_TYPE: "helm"
  {{- end }}
  {{- if not .Values.configMap.LIGHTDASH_HELM_CHART_VERSION }}
  LIGHTDASH_HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  {{- end }}
  {{- if not .Values.configMap.LIGHTDASH_MIGRATION_EXECUTION_MODE }}
  LIGHTDASH_MIGRATION_EXECUTION_MODE: "helm-boot"
  {{- end }}
  {{- toYaml .Values.configMap | nindent 2 }}
{{- end }}
