{{- $scaleDownWorkloads := eq (include "lightdash.shouldScaleDownWorkloads" .) "true" -}}
{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lightdash.fullname" . }}-migrate
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  {{- with .Values.migrationJob.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.migrationJob.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lightdash.migrationServiceAccountName" . }}
      {{- with .Values.migrationJob.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrationJob.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $scaleDownWorkloads .Values.initContainers }}
      initContainers:
        {{- if $scaleDownWorkloads }}
        - name: remove-backend-hpa
          image: "{{ .Values.migrationJob.scaleDownWorkloads.image.repository }}:{{ .Values.migrationJob.scaleDownWorkloads.image.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.scaleDownWorkloads.image.pullPolicy }}
          command:
            - kubectl
          args:
            - delete
            - horizontalpodautoscaler
            - {{ include "lightdash.fullname" . }}
            - --ignore-not-found=true
          {{- with .Values.migrationJob.scaleDownWorkloads.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: scale-down-workloads
          {{- if .Values.migrationJob.scaleDownWorkloads.force }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          args:
            - -e
            - |
              const fs = require('node:fs');
              const credentials = '/var/run/secrets/kubernetes.io/serviceaccount';
              const namespace = fs.readFileSync(`${credentials}/namespace`, 'utf8').trim();
              const token = fs.readFileSync(`${credentials}/token`, 'utf8').trim();
              const base = `/apis/apps/v1/namespaces/${encodeURIComponent(namespace)}/deployments`;
              const selector = {{ include "lightdash.applicationWorkloadSelector" . | toJson }};
              async function request(path, method, body) {
                const response = await fetch(`https://kubernetes.default.svc${path}`, {
                  method,
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/merge-patch+json',
                  },
                  body: body === null ? undefined : JSON.stringify(body),
                  signal: AbortSignal.timeout(30000),
                });
                if (!response.ok) throw new Error(`${method} ${path} failed: HTTP ${response.status}`);
                return response;
              }
              async function scaleDown() {
                const response = await request(`${base}?labelSelector=${encodeURIComponent(selector)}`, 'GET', null);
                const deployments = await response.json();
                for (const deployment of deployments.items) {
                  await request(`${base}/${encodeURIComponent(deployment.metadata.name)}/scale`, 'PATCH', {spec: {replicas: 0}});
                }
              }
              scaleDown().catch((error) => { console.error(error); process.exit(1); });
          {{- else }}
          image: "{{ .Values.migrationJob.scaleDownWorkloads.image.repository }}:{{ .Values.migrationJob.scaleDownWorkloads.image.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.scaleDownWorkloads.image.pullPolicy }}
          command:
            - kubectl
          args:
            - scale
            - deployment
            - --selector={{ include "lightdash.applicationWorkloadSelector" . }}
            - --replicas=0
          {{- end }}
          {{- with .Values.migrationJob.scaleDownWorkloads.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: wait-for-workload-termination
          image: "{{ .Values.migrationJob.scaleDownWorkloads.image.repository }}:{{ .Values.migrationJob.scaleDownWorkloads.image.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.scaleDownWorkloads.image.pullPolicy }}
          command:
            - kubectl
          args:
            - wait
            - --for=delete
            - pod
            - --selector={{ include "lightdash.applicationWorkloadSelector" . }}
            - --timeout={{ .Values.migrationJob.scaleDownWorkloads.timeoutSeconds }}s
          {{- with .Values.migrationJob.scaleDownWorkloads.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /usr/app
          command:
            - pnpm
            - -F
            - backend
            - migrate-production
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lightdash.database.secretName" . }}
                  key: {{ include "lightdash.database.secret.passwordKey" . }}
            {{- include "lightdash.migrationJobSslEnvs" . | nindent 12 }}
            {{- if .Values.migrationJob.inheritGlobalEnv }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.migrationJob.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "lightdash.fullname" . }}-migration-configmap
            {{- with (include "lightdash.secretEnvFrom" (dict "root" . "migration" true) | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- if not (empty .Values.migrationJob.resources) }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          {{- end }}
          {{- if or .Values.migrationJob.extraVolumeMounts .Values.migrationJob.ssl.enabled .Values.ssl.enabled }}
          volumeMounts:
            {{- include "lightdash.migrationJobSslVolumeMount" . | nindent 12 }}
            {{- with .Values.migrationJob.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.migrationJob.extraVolumes .Values.migrationJob.ssl.enabled .Values.ssl.enabled }}
      volumes:
        {{- include "lightdash.migrationJobSslVolume" . | nindent 8 }}
        {{- with .Values.migrationJob.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
