{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lightdash.fullname" . }}-migrate
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.migrationJob.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lightdash.migrationServiceAccountName" . }}
      {{- with .Values.migrationJob.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrationJob.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (and .Release.IsUpgrade .Values.migrationJob.scaleDownWorkloads.enabled) .Values.initContainers }}
      initContainers:
        {{- if and .Release.IsUpgrade .Values.migrationJob.scaleDownWorkloads.enabled }}
        - name: remove-backend-hpa
          image: "{{ .Values.migrationJob.scaleDownWorkloads.image.repository }}:{{ .Values.migrationJob.scaleDownWorkloads.image.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.scaleDownWorkloads.image.pullPolicy }}
          command:
            - kubectl
          args:
            - delete
            - horizontalpodautoscaler
            - {{ include "lightdash.fullname" . }}
            - --ignore-not-found=true
          {{- with .Values.migrationJob.scaleDownWorkloads.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: scale-down-workloads
          image: "{{ .Values.migrationJob.scaleDownWorkloads.image.repository }}:{{ .Values.migrationJob.scaleDownWorkloads.image.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.scaleDownWorkloads.image.pullPolicy }}
          command:
            - kubectl
          args:
            - scale
            - deployment
            - --selector={{ include "lightdash.applicationWorkloadSelector" . }}
            - --replicas=0
          {{- with .Values.migrationJob.scaleDownWorkloads.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: wait-for-workload-termination
          image: "{{ .Values.migrationJob.scaleDownWorkloads.image.repository }}:{{ .Values.migrationJob.scaleDownWorkloads.image.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.scaleDownWorkloads.image.pullPolicy }}
          command:
            - kubectl
          args:
            - wait
            - --for=delete
            - pod
            - --selector={{ include "lightdash.applicationWorkloadSelector" . }}
            - --timeout={{ .Values.migrationJob.scaleDownWorkloads.timeoutSeconds }}s
          {{- with .Values.migrationJob.scaleDownWorkloads.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /usr/app
          command:
            - pnpm
            - -F
            - backend
            - migrate-production
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lightdash.database.secretName" . }}
                  key: {{ include "lightdash.database.secret.passwordKey" . }}
            {{- include "lightdash.migrationJobSslEnvs" . | nindent 12 }}
            {{- if .Values.migrationJob.inheritGlobalEnv }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.migrationJob.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "lightdash.fullname" . }}-migration-configmap
            {{- if and .Values.migrationJob.inheritGlobalEnv .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
            {{- if .Values.migrationJob.existingSecret }}
            - secretRef:
                name: {{ .Values.migrationJob.existingSecret }}
            {{- else if not (empty .Values.secrets) }}
            - secretRef:
                name: {{ include "lightdash.fullname" . }}-migration-secrets
            {{- end }}
            {{- if .Values.s3.existingSecret }}
            - secretRef:
                name: {{ .Values.s3.existingSecret }}
            {{- end }}
          {{- if not (empty .Values.migrationJob.resources) }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          {{- end }}
          {{- if or .Values.migrationJob.extraVolumeMounts .Values.migrationJob.ssl.enabled .Values.ssl.enabled }}
          volumeMounts:
            {{- include "lightdash.migrationJobSslVolumeMount" . | nindent 12 }}
            {{- with .Values.migrationJob.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.migrationJob.extraVolumes .Values.migrationJob.ssl.enabled .Values.ssl.enabled }}
      volumes:
        {{- include "lightdash.migrationJobSslVolume" . | nindent 8 }}
        {{- with .Values.migrationJob.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
