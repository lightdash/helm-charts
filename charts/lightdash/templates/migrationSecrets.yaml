{{- if and (not .Values.secretRef.name) .Values.secrets .Values.migrationJob.enabled (not .Values.migrationJob.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "lightdash.fullname" . }}-migration-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ default "MISSING" $value | b64enc | quote }}
{{- end }}
{{- if .Values.s3.accessKey }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | b64enc | quote }}
{{- end }}
{{- if .Values.s3.secretKey }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | b64enc | quote }}
{{- end }}
{{- end }}
