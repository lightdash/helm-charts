{{- if .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "lightdash.fullname" . }}
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ default "MISSING" $value | b64enc | quote }}
{{- end -}}
{{- if and (not .Values.s3.existingSecret) (or .Values.s3.accessKey .Values.s3.secretKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "lightdash.fullname" . }}-s3
  labels:
    {{- include "lightdash.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.s3.accessKey }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.s3.secretKey }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | b64enc | quote }}
  {{- end }}
{{- end -}}
{{- end -}}
